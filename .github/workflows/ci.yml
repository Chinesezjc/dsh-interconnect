name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Layout: both repos side by side under $GITHUB_WORKSPACE so the
      # plugin's link:../dsh devDependencies resolve within the workspace
      # (actions/checkout cannot write outside it).
      - name: Checkout DeepSeek Harness sibling
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # DeepSeek Harness's packages are unpublished; its type declarations are
      # built artifacts (lib/ is gitignored). Install its workspace and build
      # the host TypeScript project so the plugin's typecheck can resolve the
      # @deepseek-ai/dsh-* types.
      - name: Install and build DeepSeek Harness types
        working-directory: dsh
        run: |
          pnpm install --config.auto-install-peers=false
          pnpm exec tsc -b tsconfig.host.json

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --config.auto-install-peers=false

      - name: Check
        working-directory: plugin
        run: pnpm run check
